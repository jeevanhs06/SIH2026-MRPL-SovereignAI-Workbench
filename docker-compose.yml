services:
  backend:
    build:
      context: ./backend
    container_name: sovereignai-backend
    env_file:
      - .env.example
    ports:
      - "8000:8000"
    volumes:
      - ./data:/workspace/data
      - ./knowledge_base:/workspace/knowledge_base:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    container_name: sovereignai-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
