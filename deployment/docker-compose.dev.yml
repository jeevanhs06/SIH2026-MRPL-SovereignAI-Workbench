services:
  backend:
    build:
      context: ../backend
    env_file:
      - ../.env.example
    ports:
      - "8000:8000"
    volumes:
      - ../data:/workspace/data
      - ../knowledge_base:/workspace/knowledge_base:ro

  frontend:
    build:
      context: ../frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
